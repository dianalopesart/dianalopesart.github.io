<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Diana Lopes | Portfólio</title>
<!-- Página usada só para gerar o PDF (ferramentas/gerar-pdf.sh). Segue a mesma ordem e o mesmo visual do site (index.html).
     Para ver no navegador: pdf.html?lang=pt ou pdf.html?lang=en -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500&display=swap">
<style>
  @page{size:A4; margin:0}
  /* Mesmas cores e fontes do site */
  :root{
    --bg:#0A0A0B; --ink:#FFFFFF; --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.1);
    --orange:#FF6A1F; --pink:#FF5E8A; --green:#34D27B;
    --font:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; background:#444}
  body{color:var(--ink); font:400 14px/1.6 var(--font); -webkit-font-smoothing:antialiased; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  a{color:inherit; text-decoration:none}
  h1,h2,h3{margin:0}

  /* Página A4 */
  .page{position:relative; width:210mm; height:297mm; overflow:hidden; background:var(--bg); margin:0 auto 24px; padding:52px 40px 84px; break-after:page; isolation:isolate}
  @media print{ html,body{background:var(--bg)} .page{margin:0} }
  /* Fundos com brilho: imagens prontas geradas por ferramentas/gerar-pdf.sh (sem desfoque no PDF) */
  .page{background-size:cover; background-position:center}
  .bg-topo{background-image:url("img/pdf/bg-topo.jpg")} .bg-marcas{background-image:url("img/pdf/bg-marcas.jpg")} .bg-projetos{background-image:url("img/pdf/bg-projetos.jpg")} .bg-expertise{background-image:url("img/pdf/bg-expertise.jpg")} .bg-contato{background-image:url("img/pdf/bg-contato.jpg")}
  .rule{height:1px; margin:0 0 34px; background:linear-gradient(90deg,#0A0A0B,#404041 20%,#404041 80%,#0A0A0B)}  /* cores sólidas: leitores simples não desenham degradê transparente */

  /* Rodapé de toda página: link clicável para o site */
  .foot{position:absolute; left:40px; right:40px; bottom:26px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:14px; border-top:1px solid var(--faint); color:var(--muted); font-size:12px}
  .foot .skd{font:italic 400 26px/1 var(--serif); color:var(--ink)}
  .foot .skd i{font-style:normal; color:var(--orange)}
  .foot a.site{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; border:1px solid var(--faint); background:var(--glass); color:var(--ink); font:600 12px/1 var(--font)}
  .foot a.site b{color:var(--orange); font-weight:600}
  .foot .n{font-variant-numeric:tabular-nums}

  /* Botões (iguais aos do site) */
  .btn{display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:0 24px; border-radius:999px; font:600 15px/1 var(--font); border:1px solid var(--faint); background:var(--glass); color:var(--ink)}
  .btn svg{width:13px; height:13px}
  .btn.main{background:var(--green); border-color:var(--green); color:#04170C}
  .kicker{display:block; font:500 12px/1 var(--font); letter-spacing:.28em; text-transform:uppercase; color:var(--orange); text-align:center}
  .title{font:300 38px/1.1 var(--font); letter-spacing:-.02em; text-align:center; margin-top:12px}
  .big-kicker{display:block; text-align:center; font:300 38px/1.1 var(--font); letter-spacing:-.02em}

  /* 1. Topo (igual ao hero do site) */
  .hero{padding-top:110px}
  .hero .id{display:flex; align-items:center; gap:30px; margin-bottom:28px}
  .hero h1{font:200 96px/.9 var(--font); text-transform:uppercase; letter-spacing:-.03em}
  .hero h1 b{font-weight:800}
  .hero h1 i{font-style:normal; color:var(--orange)}
  .hero .face{flex:none; width:210px; aspect-ratio:1; border-radius:50%; overflow:hidden; border:1px solid rgba(255,255,255,.35)}
  .hero .face img{width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block}
  .who{display:inline-flex; align-items:center; gap:8px; font:500 12px/1 var(--font); letter-spacing:.24em; text-transform:uppercase}
  .who::before{content:""; width:7px; height:7px; border-radius:50%; background:#fff; }
  .hero .bio{margin:16px 0 0; max-width:46ch; font-size:19px; font-weight:300; color:rgba(255,255,255,.82)}
  .focus{display:grid; gap:10px; margin-top:26px}
  .focus .lbl{font:500 11px/1 var(--font); letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}
  .focus ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
  .focus li{display:flex; align-items:center; white-space:nowrap; font:500 19px/1.5 var(--font)}
  .focus li span + span::before{content:""; display:inline-block; width:.3em; height:.3em; border-radius:50%; background:var(--orange); margin:0 12px; vertical-align:middle}
  .hero .ctas{display:flex; flex-wrap:wrap; gap:12px; margin-top:34px}
  .online{margin-top:46px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 24px; border-radius:20px; background:var(--glass); border:1px solid var(--faint)}
  .online small{display:block; font:500 11px/1 var(--font); letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}
  .online strong{display:block; margin-top:8px; font:600 22px/1.2 var(--font)}
  .online strong b{color:var(--orange); font-weight:600}

  /* 2. Marcas (cards do site) */
  .brands{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:40px}
  .brand{border:1px solid var(--faint); border-radius:20px; overflow:hidden; background:var(--glass); display:grid; align-content:start}
  .brand .cover{aspect-ratio:5/2; overflow:hidden}
  .brand .cover img{width:100%; height:100%; object-fit:cover; display:block; }
  .brand .head{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:0 14px}
  .brand .avatar{position:relative; z-index:1; width:72px; height:72px; margin-top:-36px; border-radius:50%; border:2px solid rgba(255,255,255,.4); background:rgba(20,20,22,.9); overflow:hidden}
  .brand .avatar img{width:100%; height:100%; object-fit:cover}
  .brand h3{font:600 15px/1.2 var(--font)}
  .brand .info{padding:8px 14px 16px; display:grid; gap:8px}
  .brand .sub{font:500 10px/1 var(--font); letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}
  .brand ul{list-style:none; margin:0; padding:0; display:grid; gap:6px}
  .brand li{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:rgba(255,255,255,.88)}
  .brand .cl{width:22px; height:22px; flex:none; border-radius:50%; background:var(--glass-2); border:1px solid var(--faint); display:grid; place-items:center; overflow:hidden; font:700 8px/1 var(--font)}
  .brand .cl img{width:100%; height:100%; object-fit:cover}

  /* 3. Projetos (cards do site) */
  .pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:30px}
  .proj{background:var(--glass); border:1px solid var(--faint); border-radius:20px; overflow:hidden; display:grid; grid-template-rows:auto 1fr}
  .proj .media{position:relative; aspect-ratio:4/3; overflow:hidden; display:block}
  .proj .media img{width:100%; height:100%; object-fit:cover; object-position:top; display:block}
  .proj .count{position:absolute; right:10px; bottom:10px; padding:5px 10px; border-radius:999px; background:rgba(10,10,11,.6); border:1px solid var(--faint); font:600 11px/1 var(--font)}
  .proj .ph{background:radial-gradient(70% 90% at 25% 70%,#FF6A1F,transparent 70%),radial-gradient(60% 80% at 85% 20%,#FF5E8A,transparent 70%),#140C0A}
  .proj .body{padding:14px 16px 16px; display:grid; gap:7px; align-content:start}
  .proj .via{font:500 10px/1.3 var(--font); letter-spacing:.2em; text-transform:uppercase; color:var(--orange)}
  .proj h3{font:600 18px/1.15 var(--font); letter-spacing:-.01em}
  .proj p{margin:0; color:var(--muted); font-size:12.5px; line-height:1.5}
  .more{justify-self:start; align-self:end; display:inline-flex; align-items:center; gap:8px; min-height:34px; margin-top:4px; padding:0 16px; border-radius:999px; border:1px solid rgba(255,94,138,.55); background:#000; font:600 13px/1 var(--font)}
  .more svg{width:11px; height:11px; color:var(--pink)}
  .center{display:flex; justify-content:center; margin-top:30px}

  /* 4. Expertise (igual ao site) */
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:0 44px; margin-top:34px}
  .col{display:grid; gap:10px; padding-block:20px; border-top:1px solid var(--faint)}
  .col .hd{display:flex; align-items:center; gap:14px}
  .col .ico{width:30px; height:30px; flex:none; color:var(--orange)}
  .col h3{font:600 19px/1.2 var(--font)}
  .col p{margin:0; color:var(--muted); font-size:14px; line-height:1.7}
  .col p span:not(:last-child)::after{content:"·"; color:var(--orange); font-weight:700; margin:0 4px 0 8px}
  .edu{margin-top:26px; border:1px solid var(--faint); border-radius:20px; padding:22px; display:grid; gap:14px; background:var(--glass)}
  .edu h3{font:500 11px/1 var(--font); letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}
  .edu ul{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .edu li{display:grid; gap:2px; padding-left:14px; border-left:2px solid var(--orange)}
  .edu b{font-weight:600}
  .edu span{color:var(--muted); font-size:13px}

  /* 5. Contato (igual ao site, com botões grandes para clicar) */
  .channels{display:grid; gap:12px; max-width:560px; margin:34px auto 0}
  .ch{display:flex; align-items:center; gap:16px; padding:18px 22px; border-radius:18px; background:var(--glass); border:1px solid var(--faint)}
  .ch .ic{width:26px; height:26px; flex:none; color:var(--orange)}
  .ch b{font-weight:600; font-size:17px; min-width:110px}
  .ch span{color:var(--muted); font-size:15px; flex:1}
  .ch em{font-style:normal; font:600 13px/1 var(--font); color:var(--pink)}
  .endcta{display:flex; justify-content:center; margin-top:36px}
  .endcta .btn{min-height:58px; padding:0 34px; font-size:17px}
  .final{position:absolute; left:40px; right:40px; bottom:84px; display:flex; justify-content:space-between; align-items:center; padding-top:22px; border-top:1px solid var(--faint); color:var(--muted); font-size:14px}
  .final .skd{font:italic 400 40px/1 var(--serif); color:var(--ink)}
  .final .skd i{font-style:normal; color:var(--orange)}
</style>
</head>
<body>
<div id="doc"></div>

<script src="projetos.js"></script>
<script src="dados.js"></script>
<script>
/* PDF do portfólio: mesmas seções e mesma ordem do site.
   Sem QR code: tudo que leva ao site é botão clicável. */
const SITE = "https://dianalopesart.github.io";
const SITE_SHOW = "dianalopesart.github.io";
const TP = {
  pt: { online:"Portfólio online", onlineNote:"Clique para ver todos os projetos e a galeria completa", open:"Abrir o site", gal:"Ver galeria completa",
        site:"Acessar o portfólio online", page:"Página", more:"Ver mais", arts:"artes", art1:"arte" },
  en: { online:"Online portfolio", onlineNote:"Click to see every project and the full gallery", open:"Open the website", gal:"See the full gallery",
        site:"Visit the online portfolio", page:"Page", more:"See more", arts:"artworks", art1:"artwork" }
};
const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pt";
const t = T[lang], tp = TP[lang];
document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
document.title = lang === "pt" ? "Diana Lopes | Portfólio" : "Diana Lopes | Portfolio";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const initials = s => s.replace(/[^A-Za-zÀ-ú0-9 ]/g, "").split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 3);
const url = (hash = "") => SITE + "/" + (lang === "en" ? "?lang=en" : "") + hash;
const pdfImg = src => src.replace(/^img\//, "img/pdf/").replace(/\.(png|webp)$/, ".jpg");   /* versões menores, só para o PDF */
const arrow = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11 11 5M6 5h5v5"/></svg>';
const siteName = SITE_SHOW.replace("dianalopesart", "<b>dianalopesart</b>");

let n = 0;
const page = (inner, cls = "") => {
  n++;
  return `<section class="page ${cls}">${inner}
    <div class="foot"><span class="skd">DL<i>.</i></span><a class="site" href="${url()}"><span>${siteName}</span>${arrow}</a><span class="n">${String(n).padStart(2, "0")}</span></div></section>`;
};

const pages = [];

/* 1. Topo */
pages.push(page(`
  <div class="id"><h1>Diana<br><b>Lopes</b><i>.</i></h1><div class="face"><img src="img/diana-2.jpg" alt=""></div></div>
  <span class="who">${esc(t["hero.who"])}</span>
  <p class="bio">${esc(t["hero.bio"])}</p>
  <div class="focus"><span class="lbl">${esc(t["hero.focus"])}</span><ul>${FOCUS[lang].map(r => `<li>${r.map(f => `<span>${esc(f)}</span>`).join("")}</li>`).join("")}</ul></div>
  <div class="ctas">
    <a class="btn" href="${url("#projetos")}">${esc(t["hero.cta1"])} ${arrow}</a>
    <a class="btn" href="${url("#contato")}">${esc(t["hero.cta2"])} ${arrow}</a>
  </div>
  <a class="online" href="${url()}"><div><small>${esc(tp.online)}</small><strong>${siteName}</strong></div><span class="btn main">${esc(tp.open)} ${arrow}</span></a>`, "hero bg-topo"));

/* 2. Marcas */
pages.push(page(`
  <div class="rule"></div>
  <h2 class="title">${esc(t["brands.t"])}</h2>
  <div class="brands">${BRANDS.map(b => `
    <div class="brand">
      <div class="cover">${b.cover ? `<img src="img/pdf/marca-${esc(b.cover.split("/").pop().replace(/\.[a-z]+$/, ""))}.jpg" alt="">` : ""}</div>
      <div class="head"><div class="avatar">${b.logo ? `<img src="${esc(b.logo)}" alt="">` : ""}</div><h3>${esc(b.name)}</h3></div>
      <div class="info">${b.clients.length
        ? `<span class="sub">${b.clients.length === 1 ? t.clientOne : t.clientsIn}</span><ul>${b.clients.map(c => `<li><span class="cl">${c.logo ? `<img src="${esc(c.logo)}" alt="">` : esc(initials(c.name))}</span>${esc(c.name)}</li>`).join("")}</ul>`
        : `<p class="sub">${esc(t.direct)}</p>`}</div>
    </div>`).join("")}</div>
  <div class="center" style="margin-top:40px"><a class="btn" href="${url("#marcas")}">${esc(tp.site)} ${arrow}</a></div>`, "bg-marcas"));

/* 3. Projetos: todos, na ordem do site, 6 por página */
const card = p => {
  const href = url("#" + projectSlug(p));
  const cover = p.cover || p.images[0];
  return `<article class="proj">
    <a class="media ${cover ? "" : "ph"}" href="${href}">${cover ? `<img src="${esc(pdfImg(cover))}" alt="">` : ""}${p.images.length ? `<span class="count">${p.images.length} ${p.images.length === 1 ? tp.art1 : tp.arts}</span>` : ""}</a>
    <div class="body"><span class="via">${esc(p.via)}</span><h3>${esc(p.client)}</h3><p>${esc(p.text[lang])}</p>
      <a class="more" href="${href}">${esc(tp.more)} ${arrow}</a></div></article>`;
};
for (let i = 0; i < PROJECTS.length; i += 6) {
  const last = i + 6 >= PROJECTS.length;
  pages.push(page(`
    ${i === 0 ? `<div class="rule"></div><span class="big-kicker">${esc(t["proj.k"])}</span>` : ""}
    <div class="pgrid">${PROJECTS.slice(i, i + 6).map(card).join("")}</div>
    ${last ? `<div class="center"><a class="btn" href="${SITE}/galeria.html">${esc(tp.gal)} ${arrow}</a></div>` : ""}`, "bg-projetos"));
}

/* 4. Expertise */
pages.push(page(`
  <div class="rule"></div>
  <span class="big-kicker">${esc(t["exp.k"])}</span>
  <div class="cols">${EXPERTISE.map(x => `
    <div class="col"><div class="hd"><svg class="ico" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${FLAT[x.ico]}</svg><h3>${esc(x[lang][0])}</h3></div>
    <p>${x[lang][1].map(li => `<span>${esc(li)}</span>`).join(" ")}</p></div>`).join("")}</div>
  <div class="edu"><h3>${esc(t["exp.edu"])}</h3><ul>${EDU.map(e => `<li><b>${esc(e[lang])}</b><span>${esc(e.place)}</span></li>`).join("")}</ul></div>`, "bg-expertise"));

/* 5. Contato */
const ICON = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${SOCIAL_ICONS[k]}</svg>`;
pages.push(page(`
  <div class="rule"></div>
  <span class="kicker" style="color:var(--pink)">${esc(t["c.k"])}</span>
  <h2 class="title">${esc(t["c.t"])}</h2>
  <div class="channels">${CONTACTS.map(c => `<a class="ch" href="${esc(c.url || "mailto:" + c.handle)}">${ICON(c.key)}<b>${esc(c.name)}</b><span>${esc(c.handle)}</span><em>${arrow}</em></a>`).join("")}</div>
  <div class="endcta"><a class="btn main" href="${url()}">${esc(tp.site)} ${arrow}</a></div>
  <div class="final"><span>© Diana Lopes · ${esc(t.footer)}</span><span class="skd">DL<i>.</i></span></div>`, "bg-contato"));

document.getElementById("doc").innerHTML = pages.join("");
</script>
</body>
</html>
